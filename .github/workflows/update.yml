name: Update mola

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"   # Her 3 saatte bir (00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)

jobs:
  update_files:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Scripti Çalıştır
        run: |
          python mola.py
          ls -la

      - name: Değişiklikleri Kaydet ve Yükle
        env:
          TZ: Europe/Istanbul
        run: |
          if [ ! -f "mola.m3u" ]; then
            echo "Hata: Kök dizinde mola.m3u oluşmadı."
            exit 1
          fi

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add mola.m3u

          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit atılmadı."
          else
            git commit -m "Güncelleme: $(date +'%d.%m.%Y %H:%M')"
            git pull --rebase origin main
            git push origin main
          fi
