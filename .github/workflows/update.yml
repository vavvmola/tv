name: Update mola

on:
  schedule:
    - cron: "0 */3 * * *" # Her 3 saatte bir (00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install requests urllib3

      - name: Generate M3U playlist
        run: python mola.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mola.m3u
          if git diff --staged --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "chore: update mola.m3u"
            git pull --rebase origin "${GITHUB_REF#refs/heads/}"
            git push
          fi
